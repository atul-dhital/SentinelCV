apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinelcv-platform-config
  namespace: sentinelcv
data:
  # DATABASE_URL and REDIS_URL are intentionally absent — injected from sentinelcv-secrets
  AI_SERVICE_URL: http://sentinelcv-ai-service:8001
  API_BASE_URL: http://sentinelcv-backend:8000/api/v1
  FRONTEND_URL: http://sentinelcv-frontend:3000
  MLFLOW_TRACKING_URI: http://mlflow:5000
  DATA_DIR: /app/data
  FACE_IMAGE_DIR: /app/data/face_images
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelcv-backend
  namespace: sentinelcv
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentinelcv-backend
  template:
    metadata:
      labels:
        app: sentinelcv-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/sentinelcv/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: sentinelcv-platform-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sentinelcv-secrets
                  key: SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sentinelcv-secrets
                  key: DATABASE_URL
            - name: INTERNAL_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: sentinelcv-secrets
                  key: INTERNAL_SERVICE_KEY
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sentinelcv-secrets
                  key: REDIS_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: sentinelcv-backend
  namespace: sentinelcv
spec:
  selector:
    app: sentinelcv-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelcv-ai-service
  namespace: sentinelcv
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentinelcv-ai-service
  template:
    metadata:
      labels:
        app: sentinelcv-ai-service
    spec:
      nodeSelector:
        accelerator: nvidia
      containers:
        - name: ai-service
          image: ghcr.io/sentinelcv/ai-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: sentinelcv-platform-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "8Gi"
              nvidia.com/gpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: sentinelcv-ai-service
  namespace: sentinelcv
spec:
  selector:
    app: sentinelcv-ai-service
  ports:
    - name: http
      port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelcv-frontend
  namespace: sentinelcv
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentinelcv-frontend
  template:
    metadata:
      labels:
        app: sentinelcv-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/sentinelcv/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: http://sentinelcv-backend:8000/api/v1
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: sentinelcv-frontend
  namespace: sentinelcv
spec:
  selector:
    app: sentinelcv-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sentinelcv-backend
  namespace: sentinelcv
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sentinelcv-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sentinelcv-ai-service
  namespace: sentinelcv
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sentinelcv-ai-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
