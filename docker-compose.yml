services:
  # ─── PostgreSQL with pgvector ──────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: sentinelcv-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: visitor_db
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_pgvector.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis (for background tasks / caching) ───────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sentinelcv-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-dev-redis-password-change-me}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev-redis-password-change-me}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Backend API ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinelcv-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/visitor_db
      SECRET_KEY: ${SECRET_KEY:-mvp-dev-secret-key-change-in-production}
      AI_SERVICE_URL: http://ai-service:8001
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev-redis-password-change-me}@redis:6379/0
      VIDEO_JOB_QUEUE_MODE: ${VIDEO_JOB_QUEUE_MODE:-redis}
      SYNTHETIC_JOB_QUEUE_MODE: ${SYNTHETIC_JOB_QUEUE_MODE:-redis}
      TEMPORAL_JOB_QUEUE_MODE: ${TEMPORAL_JOB_QUEUE_MODE:-redis}
      AUTO_ENSURE_PGVECTOR_FACE_INDEX: ${AUTO_ENSURE_PGVECTOR_FACE_INDEX:-1}
      DATA_DIR: /app/data
      PERSON_DETECTOR_MODEL: ${PERSON_DETECTOR_MODEL:-YOLOv8n}
      PERSON_DETECTOR_ARTIFACT: ${PERSON_DETECTOR_ARTIFACT:-yolov8n.pt}
      TRACKER_BACKEND: ${TRACKER_BACKEND:-ByteTrack}
      FACE_DETECTOR_BACKEND: ${FACE_DETECTOR_BACKEND:-opencv}
      FACE_RECOGNITION_MODEL: ${FACE_RECOGNITION_MODEL:-ArcFace}
      LIVENESS_MODEL_NAME: ${LIVENESS_MODEL_NAME:-Spectral + CNN Ensemble}
      LIVENESS_MODEL_PATH: ${LIVENESS_MODEL_PATH:-models/liveness_net.onnx}
      POSE_MODEL_NAME: ${POSE_MODEL_NAME:-MediaPipe Pose}
      POSE_MODEL_PATH: ${POSE_MODEL_PATH:-mediapipe.pose}
      ACTION_MODEL_NAME: ${ACTION_MODEL_NAME:-Heuristic Action Inference v1}
      ACTION_MODEL_PATH: ${ACTION_MODEL_PATH:-heuristic.action.v1}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      FACE_CONFIDENCE_THRESHOLD: ${FACE_CONFIDENCE_THRESHOLD:-0.6}
      PGVECTOR_INDEX_TYPE: ${PGVECTOR_INDEX_TYPE:-hnsw}
      PGVECTOR_IVFFLAT_PROBES: ${PGVECTOR_IVFFLAT_PROBES:-10}
      PGVECTOR_HNSW_EF_SEARCH: ${PGVECTOR_HNSW_EF_SEARCH:-64}
      PGVECTOR_CANDIDATE_LIMIT: ${PGVECTOR_CANDIDATE_LIMIT:-300}
      FRONTEND_URL: http://localhost:3001
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinelcv-queue-worker
    command:
      - python
      - scripts/advanced_job_worker.py
      - --job-type
      - all
      - --poll-interval
      - "1"
      - --pop-timeout
      - "5"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/visitor_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev-redis-password-change-me}@redis:6379/0
      AI_SERVICE_URL: http://ai-service:8001
      VIDEO_JOB_QUEUE_MODE: ${VIDEO_JOB_QUEUE_MODE:-redis}
      SYNTHETIC_JOB_QUEUE_MODE: ${SYNTHETIC_JOB_QUEUE_MODE:-redis}
      TEMPORAL_JOB_QUEUE_MODE: ${TEMPORAL_JOB_QUEUE_MODE:-redis}
      AUTO_ENSURE_PGVECTOR_FACE_INDEX: ${AUTO_ENSURE_PGVECTOR_FACE_INDEX:-1}
    volumes:
      - backend-data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  # ─── Frontend (Next.js) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinelcv-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3001:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # ─── AI Processing Service ─────────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai_services
      dockerfile: Dockerfile
    container_name: sentinelcv-ai
    environment:
      API_BASE_URL: http://backend:8000/api/v1
      DATA_DIR: /app/data
      FACE_IMAGE_DIR: /app/data/face_images
      PERSON_DETECTOR_MODEL: ${PERSON_DETECTOR_MODEL:-YOLOv8n}
      PERSON_DETECTOR_ARTIFACT: ${PERSON_DETECTOR_ARTIFACT:-yolov8n.pt}
      TRACKER_BACKEND: ${TRACKER_BACKEND:-ByteTrack}
      FACE_DETECTOR_BACKEND: ${FACE_DETECTOR_BACKEND:-opencv}
      FACE_RECOGNITION_MODEL: ${FACE_RECOGNITION_MODEL:-ArcFace}
      LIVENESS_MODEL_NAME: ${LIVENESS_MODEL_NAME:-Spectral + CNN Ensemble}
      LIVENESS_MODEL_PATH: ${LIVENESS_MODEL_PATH:-models/liveness_net.onnx}
      POSE_MODEL_NAME: ${POSE_MODEL_NAME:-MediaPipe Pose}
      POSE_MODEL_PATH: ${POSE_MODEL_PATH:-mediapipe.pose}
      ACTION_MODEL_NAME: ${ACTION_MODEL_NAME:-Heuristic Action Inference v1}
      ACTION_MODEL_PATH: ${ACTION_MODEL_PATH:-heuristic.action.v1}
    ports:
      - "8001:8001"
    volumes:
      - backend-data:/app/data
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: sentinelcv-prometheus
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend
      - ai-service
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: sentinelcv-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme_grafana}
    ports:
      - "3002:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: sentinelcv-elasticsearch
    profiles: ["observability"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: sentinelcv-kibana
    profiles: ["observability"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    restart: unless-stopped

  fluent-bit:
    image: fluent/fluent-bit:3.1.9
    container_name: sentinelcv-fluent-bit
    profiles: ["observability"]
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.conf"]
    volumes:
      - ./ops/logging/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./ops/logging/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
    depends_on:
      - elasticsearch
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
  backend-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  elasticsearch-data:
    driver: local
