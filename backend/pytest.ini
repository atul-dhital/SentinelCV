[pytest]
testpaths = tests
markers =
    unit: fast, no external services, no real ML models
    integration: exercises the FastAPI app through TestClient
    postgres: requires a real PostgreSQL + pgvector database (skipped on SQLite)
    security: authorization, path-boundary, SSRF, and other attack-surface tests
    tenant: cross-organization isolation tests
    ai_synthetic: exercises or depends on ALLOW_SYNTHETIC_BIOMETRIC_FALLBACK
    ai_real: requires real model weights loaded (ArcFace/YOLO/etc.), skips if absent
    requires_experimental: only runs when ENABLE_EXPERIMENTAL_FEATURES=1 mounted the router at app-import time
    e2e: end-to-end (Playwright, separate frontend suite)
    performance: load/benchmark tests, excluded from default runs
    slow: tests that take noticeably longer than the rest of the suite
